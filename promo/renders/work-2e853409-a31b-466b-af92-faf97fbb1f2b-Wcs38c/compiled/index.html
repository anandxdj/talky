    <div id="root" data-composition-id="main" data-format="wide" data-start="0" data-duration="39" data-width="1920" data-height="1080" data-fps="60" data-motion-blur="on" data-motion-blur-shutter="200">
      <div id="bg" class="layer" data-motion-blur="off"></div>

      <!-- 1 · hook -->

        <div id="mark"><svg viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="8" fill="#F0EFEC" />

        </svg></div>
        <h1 id="hook-title"><span class="ln"><span class="w">Your </span><span class="w">WhatsApp, </span><span class="w">answered </span><span class="w">in </span><span class="w accent">your </span><span class="w accent">voice.</span></span></h1>
      </div>
      <div id="morph" class="layer"></div>

      <!-- product stage (tall: its own band under the captions) -->
      <div id="stage" class="layer">

        <img class="plate" src="assets/wide/overview-start.png" alt="">
        <video id="v-hourly" class="clip" src="assets/wide/overview-hourly.mp4" muted playsinline data-start="5.75" data-duration="7.15" data-end="12.9" data-has-audio="false"></video>

      </div>

      <div id="w-queue" class="world">

      </div>

      <!-- 4 · voice fingerprint -->
      <div id="w-voice" class="world">
        <img class="plate" src="assets/wide/voice-start.png" alt="">

        <video id="v-dumbbell" class="clip" src="assets/wide/voice-dumbbell.mp4" muted playsinline data-start="24" data-duration="4.70" data-end="28.7" data-has-audio="false"></video>
        <video id="v-lengths" class="clip" src="assets/wide/voice-lengths.mp4" muted playsinline data-start="26.3" data-duration="2.40" data-end="28.7" data-has-audio="false"></video>
      </div>

      <!-- 5 · control: Pause replies, then the theme flip -->
      <div id="w-control" class="world">
        <video id="v-control" class="clip" src="assets/wide/control.mp4" muted playsinline data-start="28.7" data-duration="4.35" data-end="33.05" data-has-audio="false"></video>

      </div>

      </div>

      </div>
      <div id="cap-voice" class="cap">
        <div class="pill"><span class="ln"><span class="w">Sounds </span><span class="w">like </span><span class="w accent">you.</span></span></div>
      </div>
      <div id="cap-control" class="cap">
        <div class="pill"><span class="ln"><span class="w accent">One </span><span class="w accent">switch. </span><span class="w">Total </span><span class="w">control.</span></span></div>
      </div>

      <div id="end" class="layer" data-at="33.2">
        <div id="end-lockup">
          <div id="end-mark"><svg viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="8" fill="#F0EFEC" />

        </svg></div>
          <div id="end-word">talky</div>
        </div>
        <div id="end-line"><span class="w">Local-first. </span><span class="w">Private. </span><span class="w accent">Yours.</span></div>
